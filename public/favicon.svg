<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="l_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#00DC82" />
    </linearGradient>
    <linearGradient id="border_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DC82" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00DC82" stop-opacity="0.10" />
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="512" height="512" rx="124" fill="url(#bg_gradient)" />
  <rect x="5" y="5" width="502" height="502" rx="119" fill="none" stroke="url(#border_gradient)" stroke-width="10" />
  
  <!-- Code bracket '<' (White) -->
  <path d="M 213 155 L 118 256 L 213 357" 
        fill="none" stroke="#F8FAFC" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- 'L' lettermark (Nuxt Emerald Green) -->
  <path d="M 288 155 L 288 357 L 394 357" 
        fill="none" stroke="url(#l_gradient)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" />
</svg>
