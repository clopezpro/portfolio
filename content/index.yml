faq:
  title: Preguntas Frecuentes
  description: Respuestas a preguntas comunes sobre mi proceso y servicios.
  categories:
    - title: Servicios y Proceso
      questions:
        - label: ¿Qué servicios ofreces?
          content: |
            Darrollo de sistemas web a medida para empresas, mantenimiento de software, tengo un SAS en el que ofresco servicios de facturacion electronica, nominas, contabilidad, cuentas por cobrar, cuentas por pagar, etc.
        - label: ¿Qué stack usas actualmente?
          content: |
            Actualmente trabajo con Docker, Linux, Nuxt.js, Typescript, MongoDB y MariaDB. 
    - title: Precio y tiempos
      questions:
        - label: ¿Cuáles son tus términos de pago?
          content: |
            Generalmente requiero un depósito del 40% para programar el proyecto y comenzar a trabajar, con el 60% restante debido al finalizar el proyecto exitosamente y entregarlo. Acepto pagos mediante transferencia bancaria .
        - label: ¿Cuánto tiempo lleva un proyecto típico?
          content: |
            El tiempo que toma un proyecto puede variar significativamente dependiendo de la complejidad y el alcance del trabajo. Los proyectos más pequeños suelen tomar alrededor de 2 a 4 semanas, mientras que los proyectos más grandes y complejos pueden tomar entre 2 y 4 meses o más, dependiendo de los requerimientos.
        - label: ¿Ofreces servicios de soporte continuo?
          content: |
             Sí, para clientes que necesitan soporte de desarrollo continuo, de nuevas características o mantenimiento, ofrezco opciones de cuota mensual adaptadas a las necesidades específicas.
    - title: Sobre Trabajo Remoto o Hibrido
      questions:
        - label: ¿Trabajarias con nosotros a largo plazo?
          content: |
            Sí, siempre y cuando haya un proyecto de por medio y una propuesta interesante.
        - label: ¿Trabajarias Fuera del País?
          content: |
            Si es temporal, Si 
        - label: ¿Trabajarias de forma Presencial?
          content: |
            Si, tengo disponibilidad para trabajar de forma presencial.     
    - title: Sobre mi
      questions:
        - label: ¿Qué es lo que más disfrutas de tu trabajo?
          content: |
             Me apasiona el desafío de resolver problemas complejos a través del desarrollo de software y la tecnología. Es increíble ver cómo las personas interactúan con algo que he creado y lo encuentran realmente útil y fácil de usar. Cerrar la brecha entre las necesidades del usuario y las posibilidades técnicas es lo que realmente me entusiasma.
        - label: ¿Qué hobbies tienes fuera del trabajo?
          content: |
            Fuera del trabajo me gusta pasar tiempo con mi familia, e ir al campo.
