blog:
  title: "Últimos Artículos"
faq:
  title: Preguntas Frecuentes
  description: Respuestas a preguntas comunes sobre mi proceso y servicios.
  categories:
    - title: Facturación Electrónica y Licencias SRI
      questions:
        - label: ¿Cómo puedo adquirir una licencia de Facturador y verificar tu acreditación ante el SRI?
          content: |
            Puedes adquirir licencias directamente escribiendo a clopezpro@outlook.com o agendando una llamada en cal.com/clopezpro. Mi acreditación como proveedor de facturación electrónica puede ser verificada oficialmente ante el SRI con el RUC 0931048003001, bajo la resolución No. NAC-DGERCGC26-00000027 y actividad económica J62021002. El sistema Facturador es 100% de mi autoría, garantizando soporte directo, legalidad y seguridad sin intermediarios.
        - label: ¿El sistema Facturador cumple con todos los requisitos del SRI?
          content: |
            Sí. Facturador se conecta de forma directa a los Web Services del SRI, soporta firma electrónica en formato XAdES-BES, maneja comprobantes autorizados (Facturas, Retenciones, Notas de Crédito, Débito y Guías de Remisión) y genera automáticamente los archivos XML y RIDE en PDF.
    - title: Servicios y Proceso
      questions:
        - label: ¿Qué servicios ofreces?
          content: |
            Desarrollo de sistemas web a medida para empresas, mantenimiento de software, y servicios SaaS de facturación electrónica, nóminas, contabilidad, cuentas por cobrar y cuentas por pagar.
        - label: ¿Qué stack usas actualmente?
          content: |
            Actualmente trabajo con Docker, Linux, Nuxt, TypeScript, MongoDB y MariaDB.
    - title: Precio y tiempos
      questions:
        - label: ¿Cuáles son tus términos de pago?
          content: |
            Generalmente requiero un depósito del 40% para programar el proyecto y comenzar a trabajar, con el 60% restante debido al finalizar el proyecto exitosamente y entregarlo. Acepto pagos mediante transferencia bancaria.
        - label: ¿Cuánto tiempo lleva un proyecto típico?
          content: |
            El tiempo que toma un proyecto varía según su complejidad y alcance. Los proyectos pequeños suelen tomar de 2 a 4 semanas, mientras que plataformas más complejas toman entre 2 y 4 meses o más.
        - label: ¿Ofreces servicios de soporte continuo?
          content: |
            Sí, para clientes que necesitan soporte continuo, nuevas características o mantenimiento normativo, ofrezco planes mensuales adaptados a cada necesidad.
    - title: Sobre Trabajo Remoto o Híbrido
      questions:
        - label: ¿Trabajarías con nosotros a largo plazo?
          content: |
            Sí, siempre y cuando exista un proyecto de por medio y una propuesta sólida.
        - label: ¿Trabajarías fuera del país?
          content: |
            Si es temporal, sí.
        - label: ¿Trabajarías de forma presencial?
          content: |
            Sí, tengo disponibilidad para laborar de forma presencial en proyectos clave.
    - title: Sobre mí
      questions:
        - label: ¿Qué es lo que más disfrutas de tu trabajo?
          content: |
            Me apasiona el desafío de resolver problemas complejos a través del desarrollo de software y la tecnología. Cerrar la brecha entre las necesidades fiscales y operativas del negocio y las posibilidades técnicas es lo que me entusiasma.
        - label: ¿Qué hobbies tienes fuera del trabajo?
          content: |
            Fuera del trabajo me gusta pasar tiempo con mi familia e ir al campo.
