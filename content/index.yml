about:
  title: "Desarrollo de Sistemas y Soluciones Empresariales"
  description: |
    Soy un desarrollador de sistemas con más de 9 años de trayectoria creando software en Ecuador. 
    Mi enfoque principal es la arquitectura, desarrollo e implementación de sistemas contables, ERP y plataformas de facturación electrónica para empresas.
    Trabajo de forma directa con contadores, directores financieros y dueños de negocio para automatizar procesos críticos con software rápido, seguro y sin intermediarios.
    Creador y responsable titular del sistema contable Facturador.
    
