about:
  title: "Acerca de mí"
  description: |
    Soy un Desarrollador Fullstack con mas de 9 años de experiencia en la creación de aplicaciones web en Ecuador. 
    Estoy enfocado en sistemas contables y de gestión empresarial para pequeñas y medianas empresas.
    Trabajo de la mano con contadores, gerentes y dueños de negocios para entender sus necesidades y crear soluciones.
    Soy el desarrollador y responsable del Sistema contable Facturador, un software de facturación electrónica, contabilidad y gestión empresarial que ayuda a las empresas a cumplir con las regulaciones fiscales y mejorar su eficiencia operativa.
    
